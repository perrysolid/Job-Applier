# ============================================================================
# Pipeline configuration.
# ============================================================================

resume:
  # static   -> always upload `primary`, the resume Parth already trusts
  # tailored -> upload the job-family variant from tailor/build.py
  mode: static
  primary: data/resumes/Parth_Mishra_primary.pdf
  tailored_dir: data/resumes

search:
  internshala:
    enabled: true
    pages: 2            # ~49 postings per page per category

  # Role keywords fanned out across every discovery source.
  keywords:
    - machine learning intern
    - data science intern
    - ai intern
    - software engineer intern
    - backend developer intern
    - data analyst intern
    - computer vision intern
    - mlops intern
    - graduate engineer trainee
    - associate software engineer

  # "apply everywhere" = anywhere in India, plus anything remote. Parth cannot
  # take a US or EU role without sponsorship, so those are noise, not options.
  #
  # This matches India POSITIVELY. The first attempt excluded a list of foreign
  # cities instead, and "Mountain View, California" and "US-WA-Bellevue" walked
  # straight through it — an exclude list of place names is exactly as brittle
  # as the allowlist it replaced.
  apply_everywhere: true
  # Sources that only ever list Indian roles. Running a city allowlist over
  # these drops legitimate postings in smaller cities (Nagercoil, Erode, Hubli)
  # for no benefit — every posting on them is already in India.
  india_only_sources: [internshala, naukri]
  # Checked BEFORE india_markers and wins over them. Needed because postings
  # lead with a work-mode word: "Hybrid - San Francisco, CA" and "Remote - US"
  # both matched the India list on "hybrid"/"remote" and sailed through.
  foreign_markers:
    # Bare codes are matched on word boundaries, not as substrings, so "us"
    # does not fire on "Belarus" and "ca" does not fire on "Calcutta".
    - us
    - usa
    - uk
    - eu
    - emea
    - apac
    - latam
    - united states
    - "u.s."
    - ", ca"
    - ", ny"
    - ", wa"
    - ", tx"
    - ", ma"
    - ", il"
    - ", co"
    - ", ga"
    - "us-"
    - california
    - new york
